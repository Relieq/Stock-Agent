# Chạy từ thư mục Code/:
#   docker compose -f infra/docker-compose.yml up -d                 # CSDL + web + bộ canh
#   docker compose -f infra/docker-compose.yml up -d db              # chỉ CSDL
#   docker compose -f infra/docker-compose.yml run --rm app python -m services.extraction cost   # lệnh chạy một lần
# Trên máy phát triển, thư mục Code/ và Data/raw/ được gắn vào container: sửa code có hiệu lực ngay, không cần build lại
# (web cần khởi động lại: docker compose ... restart web).
# restart: always (không phải unless-stopped): khi Docker Desktop tắt theo máy, các dịch vụ bị coi là đã dừng tay và
# unless-stopped không bật lại; bộ canh từng nằm im gần một ngày (18-19/10/2026) vì vậy.

x-app: &app
  build: ..
  image: soi-app
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql://soi:soi@db:5432/soi
    RAW_DATA_DIR: /app/Data/raw
  volumes:
    - ..:/app/Code
    - ../../Data/raw:/app/Data/raw
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: soi-db
    environment:
      POSTGRES_USER: soi
      POSTGRES_PASSWORD: soi
      POSTGRES_DB: soi
    ports:
      # Cổng 5433 để không đụng PostgreSQL cài sẵn trên máy (nếu có)
      - "5433:5432"
    volumes:
      - soi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soi -d soi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  web:
    <<: *app
    container_name: soi-web
    command: python -m services.api --host 0.0.0.0 --port 8765
    environment:
      DATABASE_URL: postgresql://soi:soi@db:5432/soi
      RAW_DATA_DIR: /app/Data/raw
      DEV_LOGIN_LINK: "1"          # chỉ trên máy phát triển: hiện link đăng nhập ngay trên trang khi chưa có SMTP
    ports:
      - "127.0.0.1:8765:8765"     # chỉ mở cho chính máy này
    restart: always

  watcher:
    <<: *app
    container_name: soi-watcher
    command: python -u -m services.watcher --interval 15
    restart: always

  # Sao lưu hằng ngày (infra/backup.sh). Thư mục đích: biến SOI_BACKUP_DIR trong infra/.env, mặc định Data/backup.
  # Không trỏ vào ổ ảo của Google Drive for desktop (G:): Docker Desktop ghi vào một thư mục riêng trong máy ảo, Windows
  # và Drive không thấy file. Muốn đưa lên Drive thì dùng tính năng sao lưu thư mục của ứng dụng Drive cho Data/backup.
  backup:
    image: pgvector/pgvector:pg16
    container_name: soi-backup
    environment:
      PGPASSWORD: soi
      TZ: Asia/Ho_Chi_Minh
    entrypoint: ["sh", "/backup.sh"]
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ../../Data/raw:/data:ro
      - ${SOI_BACKUP_DIR:-../../Data/backup}:/backup
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # Lệnh chạy một lần: docker compose -f infra/docker-compose.yml run --rm app <lệnh>
  app:
    <<: *app
    profiles: ["tools"]
    command: python -m pytest -q

volumes:
  soi-db-data:
