[project]
name = "soi"
version = "0.1.0"
description = "Thu thập, kiểm chứng và phân tích BCTC doanh nghiệp niêm yết Việt Nam"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pymupdf==1.28.2",        # bản 2.0 dựng đáp án của phép đo bằng PDF gốc khác đi; giữ một bản cho máy và Docker
    "openai>=1.60",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pillow>=10",
    "anthropic>=1.15,<2",       # bản 2 đổi API chưa kiểm với llm.py
    "openpyxl>=3.1",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.2",
    "weasyprint>=66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"services.api" = ["templates/*.html", "static/*"]
